name: Build Liftbook APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          unzip -o "$ZIP" -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: project
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp project/app/build/outputs/apk/release/app-release.apk "Liftbook-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Liftbook-APK
          path: Liftbook-*.apk

      - name: Publish to Releases (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Liftbook build ${{ github.run_number }}
          files: Liftbook-*.apk
          
